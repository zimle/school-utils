<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klammer-Rechner – Rechnen üben</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #26324a; background: #f3f5ff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 30px 16px 50px; }
    main { width: min(680px, 100%); margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { color: #493c9b; font-size: clamp(1.8rem, 7vw, 2.5rem); margin: 0 0 6px; }
    header p { margin: 0; color: #58647d; }
    #aufgaben { display: grid; gap: 16px; }
    .block { background: white; border: 2px solid #e1e5f3; border-radius: 18px; padding: 18px; box-shadow: 0 5px 16px #26324a10; }
    .block h2 { margin: 0 0 10px; font-size: 1rem; color: #7469b7; }
    .zeile { display: grid; grid-template-columns: minmax(0, 1fr) 100px 28px; align-items: center; gap: 9px; padding: 9px 0; }
    .zeile + .zeile { border-top: 1px dashed #dce1ef; }
    .rechnung { font-size: clamp(1.05rem, 4vw, 1.35rem); white-space: nowrap; font-variant-numeric: tabular-nums; }
    input { width: 100%; min-width: 0; padding: 7px; border: 2px solid #cbd2e5; border-radius: 9px; font: inherit; font-size: 1.2rem; text-align: center; }
    /* Keine Spinner-Pfeile zum schrittweisen Durchprobieren der Antworten. */
    input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { appearance: none; -webkit-appearance: none; margin: 0; }
    input { appearance: textfield; -moz-appearance: textfield; }
    input:focus { outline: 3px solid #e2deff; border-color: #6554c0; }
    .zeichen { min-height: 1.5em; text-align: center; font-size: 1.45rem; font-weight: 800; }
    .richtig { color: #18834b; } .falsch { color: #d44242; }
    @media (max-width: 400px) { .block { padding: 14px; } .zeile { grid-template-columns: minmax(0, 1fr) 76px 24px; gap: 6px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Klammer-Rechner ✨</h1>
      <p>Rechne beide Aufgaben aus. Was verändert die Klammer?</p>
    </header>
    <section id="aufgaben" aria-label="Aufgabenpaare"></section>
  </main>
  <script>
    const liste = document.querySelector('#aufgaben');
    let nummer = 0;

    // Zerlegt eine Zahl in Primfaktoren und gibt deren Exponenten zurück.
    function primfaktoren(n) {
      const ergebnis = new Map();
      for (let p = 2; p * p <= n; p++) {
        while (n % p === 0) {
          ergebnis.set(p, (ergebnis.get(p) || 0) + 1);
          n /= p;
        }
      }
      if (n > 1) ergebnis.set(n, (ergebnis.get(n) || 0) + 1);
      return ergebnis;
    }

    // Das kgV entsteht aus den höchsten Primfaktorpotenzen beider Zahlen.
    function kgV(a, b) {
      const fa = primfaktoren(a), fb = primfaktoren(b);
      let produkt = 1;
      for (const p of new Set([...fa.keys(), ...fb.keys()])) {
        produkt *= p ** Math.max(fa.get(p) || 0, fb.get(p) || 0);
      }
      return produkt;
    }

    function zufall(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function neuesPaar() {
      if (Math.random() < 0.5) {
        const b = zufall(2, 9), c = zufall(1, 9);
        // Die Zahl ist durch b und b+c teilbar; beide Divisionen gehen auf.
        const a = kgV(b, b + c) * zufall(1, 4);
        return [
          { text: `${a} : ${b} + ${c}`, wert: a / b + c },
          { text: `${a} : (${b} + ${c})`, wert: a / (b + c) }
        ];
      }
      const d = zufall(4, 12), c = zufall(1, d - 1), andererTeiler = d - c;
      // d-c bleibt positiv. a ist ein Vielfaches von d und d-c. Der
      // Multiplikator ist außerdem groß genug, damit a/d - c nicht negativ ist.
      const vielfaches = kgV(d, andererTeiler);
      const kleinsterMultiplikator = Math.ceil(c / (vielfaches / d));
      const a = vielfaches * (kleinsterMultiplikator + zufall(0, 3));
      return [
        { text: `${a} : ${d} − ${c}`, wert: a / d - c },
        { text: `${a} : (${d} − ${c})`, wert: a / andererTeiler }
      ];
    }

    function aufgabenblockHinzufuegen() {
      nummer++;
      const paar = neuesPaar();
      const block = document.createElement('article');
      block.className = 'block';
      const titel = document.createElement('h2');
      titel.textContent = `Aufgabenpaar ${nummer}`;
      block.append(titel);
      let richtigeAntworten = 0;

      paar.forEach((aufgabe) => {
        const zeile = document.createElement('div');
        zeile.className = 'zeile';
        const rechnung = document.createElement('label');
        rechnung.className = 'rechnung';
        rechnung.textContent = `${aufgabe.text} =`;
        const eingabe = document.createElement('input');
        eingabe.type = 'number';
        eingabe.step = '1';
        eingabe.inputMode = 'numeric';
        eingabe.setAttribute('aria-label', `Ergebnis von ${aufgabe.text}`);
        eingabe.addEventListener('keydown', (ereignis) => {
          if (ereignis.key === 'ArrowUp' || ereignis.key === 'ArrowDown') ereignis.preventDefault();
        });
        const zeichen = document.createElement('span');
        zeichen.className = 'zeichen';
        zeichen.setAttribute('aria-live', 'polite');
        zeile.append(rechnung, eingabe, zeichen);
        block.append(zeile);

        eingabe.addEventListener('input', () => {
          const leer = eingabe.value.trim() === '';
          const istRichtig = !leer && Number(eingabe.value) === aufgabe.wert;
          zeichen.textContent = leer ? '' : istRichtig ? '✓' : '✗';
          zeichen.className = `zeichen ${istRichtig ? 'richtig' : 'falsch'}`;
          zeichen.setAttribute('aria-label', leer ? '' : istRichtig ? 'Richtig' : 'Noch nicht richtig');

          if (istRichtig && eingabe.dataset.richtig !== 'ja') {
            eingabe.dataset.richtig = 'ja';
            richtigeAntworten++;
          } else if (!istRichtig && eingabe.dataset.richtig === 'ja') {
            delete eingabe.dataset.richtig;
            richtigeAntworten--;
          }

          if (richtigeAntworten === 2 && !block.dataset.geloest) {
            block.dataset.geloest = 'ja';
            aufgabenblockHinzufuegen();
          } else if (richtigeAntworten < 2 && block.dataset.geloest) {
            delete block.dataset.geloest;
            if (block.nextElementSibling) block.nextElementSibling.remove();
          }
        });
      });
      liste.append(block);
    }

    aufgabenblockHinzufuegen();
  </script>
</body>
</html>
