<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klammer-Rechner – Rechnen üben</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #26324a; background: #f3f5ff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 30px 16px 50px; }
    main { width: min(680px, 100%); margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { color: #493c9b; font-size: clamp(1.8rem, 7vw, 2.5rem); margin: 0 0 6px; }
    header p { margin: 0; color: #58647d; }
    #aufgaben { display: grid; gap: 16px; }
    .block { background: white; border: 2px solid #e1e5f3; border-radius: 18px; padding: 18px; box-shadow: 0 5px 16px #26324a10; }
    .block h2 { margin: 0 0 10px; font-size: 1rem; color: #7469b7; }
    .zeile { display: grid; grid-template-columns: minmax(0, 1fr) 100px 28px; align-items: center; gap: 9px; padding: 9px 0; }
    .zeile + .zeile { border-top: 1px dashed #dce1ef; }
    .rechnung { font-size: clamp(1.05rem, 4vw, 1.35rem); white-space: nowrap; font-variant-numeric: tabular-nums; }
    input { width: 100%; min-width: 0; padding: 7px; border: 2px solid #cbd2e5; border-radius: 9px; font: inherit; font-size: 1.2rem; text-align: center; }
    input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { appearance: none; -webkit-appearance: none; margin: 0; }
    input { appearance: textfield; -moz-appearance: textfield; }
    input:focus { outline: 3px solid #e2deff; border-color: #6554c0; }
    .zeichen { min-height: 1.5em; text-align: center; font-size: 1.45rem; font-weight: 800; }
    .richtig { color: #18834b; } .falsch { color: #d44242; }
    @media (max-width: 400px) { .block { padding: 14px; } .zeile { grid-template-columns: minmax(0, 1fr) 76px 24px; gap: 6px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Klammer-Rechner ✨</h1>
      <p>Rechne beide Aufgaben aus. Was verändert die Klammer?</p>
    </header>
    <section id="aufgaben" aria-label="Aufgabenpaare"></section>
  </main>
  <!-- APP_SCRIPT -->
</body>
</html>
